version: "3.8"

services:
  lumina-backend:
    build: .
    container_name: lumina-backend
    ports:
      - "8000:8000"
    volumes:
      # 将本地的数据目录映射到容器，保证 SQLite 和 ChromaDB 重启不丢数据
      - ./data:/app/data
    environment:
      # 在这里配置你的真实环境变量
      - ALIYUN_API_KEY=your_aliyun_api_key_here
      - ENVIRONMENT=production
    restart: always
